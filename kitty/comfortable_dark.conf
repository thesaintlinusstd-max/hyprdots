# Neutral Black - مشکی خالص + سفید خنثی (بدون ته‌مایه آبی)
# سرتیتر/بولد: زرد، سبز، نارنجی | خطا: قرمز | بقیه: آبی، سفید

# --- فونت و تنظیمات (دست نزن) ---
shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0.5
window_padding_width 7
window_padding_height 10
scrollback_lines 5000
font_size 8.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
background_opacity 0.92
draw_bold_text_with_bright_colors yes

# --- متن اصلی: سفید خنثی ---
foreground           #F2F2F2
background           #000000
cursor               #FF9E2C
cursor_text_color    #000000

selection_foreground #FFFFFF
selection_background #333333

url_color            #60A5FA

# --- تب بار ---
active_tab_foreground   #000000
active_tab_background   #FFD60A
inactive_tab_foreground #B0B0B0
inactive_tab_background #000000
tab_bar_background      #000000

# --- 16 رنگ اصلی ---
# مشکی و طوسی خنثی (نه آبی)
color0  #222222
color8  #808080

# قرمز خطا + نارنجی سرتیتر
color1  #FF4444
color9  #FF9E2C

# سبز سرتیتر/اوکی
color2  #22C55E
color10 #4ADE80

# زرد سرتیتر
color3  #EAB308
color11 #FFD60A

# آبی اطلاعات (فقط برای لینک و جزئیات)
color4  #3B82F6
color12 #60A5FA

# بنفش (خنثی، کم‌استفاده)
color5  #A78BFA
color13 #C4B5FD

# فیروزه‌ای
color6  #22D3EE
color14 #67E8F9

# سفید خنثی
color7  #D4D4D4
color15 #FFFFFF
